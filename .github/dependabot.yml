version: 2
updates:

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      pip-updates:
        patterns:
          - "*"
        open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      cargo-updates:
        patterns:
          - "*"
        open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: monthly
    groups:
      github-actions-updates:
        patterns:
          - "*"
        open-pull-requests-limit: 5
