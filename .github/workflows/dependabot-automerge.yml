name: Dependabot auto-merge
on:
  workflow_run:
    workflows:

      - "CI"

    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
jobs:
  auto-merge:
    if: >
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Find the open PR for the head branch
        id: find-pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open'
            });
            if (pulls.length === 0) {
              core.setFailed('No open PR found for branch');
              return;
            }
            const pr = pulls[0];
            core.setOutput('pr_number', pr.number);
            core.setOutput('head_sha', pr.head.sha);
      - name: Check all checks on the head SHA
        id: check-status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        if: steps.find-pr.outputs.pr_number != ''
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              per_page: 100
            });
            const { data: commitStatuses } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              per_page: 100
            });
            let allSuccess = true;
            let hasPending = false;
            for (const run of checkRuns.check_runs) {
              if (run.conclusion === 'success' || run.conclusion === 'skipped' || run.conclusion === 'neutral') {
                continue;
              }
              if (run.status === 'in_progress' || run.status === 'queued' || run.status === 'requested') {
                hasPending = true;
                continue;
              }
              allSuccess = false;
            }
            for (const status of commitStatuses.statuses) {
              if (status.state === 'success' || status.state === 'skipped' || status.state === 'neutral') {
                continue;
              }
              if (status.state === 'pending') {
                hasPending = true;
                continue;
              }
              allSuccess = false;
            }
            if (hasPending) {
              core.setOutput('status', 'pending');
              return;
            }
            if (!allSuccess) {
              core.setOutput('status', 'failure');
              return;
            }
            core.setOutput('status', 'success');
      - name: Merge the PR
        if: steps.check-status.outputs.status == 'success'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash'
            });
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.payload.workflow_run.head_branch}`
            });