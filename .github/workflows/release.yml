name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        env:
          TAG_SHA: ${{ github.sha }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          # Fail closed if the tag points at a commit that is not an ancestor
          # of main. This ensures every release has been through the main
          # branch (and therefore the PR / CI gate), even if an attacker with
          # tag-push rights tries to release off a side branch.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::tag ${TAG_REF} (${TAG_SHA}) is not reachable from origin/main; refusing to release"
            exit 1
          fi

      - name: Extract changelog for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # `awk -v` binds `target` as data, never program text; `index(...) == 1`
          # is a literal prefix match (no regex interpretation of VERSION).
          awk -v target="## [${VERSION}]" '
            index($0, target) == 1 { found = 1; next }
            /^## \[/               { if (found) exit }
            found
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry for ${VERSION}, falling back to auto-generated notes." > RELEASE_NOTES.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body_path: RELEASE_NOTES.md

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: Verify package
        run: cargo package --locked
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
